<div class="container">

  <input id="creatorName" maxlength="15" placeholder="내 이름">
  <select id="category">
    <option value="friend">💙 우정 테스트</option>
    <option value="love">❤️ 사랑/궁합 테스트</option>
    <option value="random">✨ 랜덤 테스트</option>
  </select>
  <button onclick="beginCreator()">30문제 만들기</button>
  <button class="secondary" onclick="goHome()">뒤로</button>
</section>

<section id="creatorQuiz" class="card hidden">
  <div class="progress" id="creatorProgress"></div>
  <div class="question" id="creatorQuestion"></div>
  <div id="creatorAnswers"></div>
  <button id="creatorNext" onclick="creatorNext()" disabled>다음 문제</button>
</section>

<section id="share" class="card hidden">

  <div class="linkbox" id="shareLink"></div>
  <button onclick="copyLink()">🔗 링크 복사</button>
  <button onclick="showResults()">📊 친구 결과 보기</button>
  <button class="secondary" onclick="goHome()">처음으로</button>
</section>

<section id="join" class="card hidden">

  <p class="small" id="joinDesc"></p>
  <input id="friendName" maxlength="15" placeholder="내 이름">
  <button onclick="beginFriend()">테스트 시작</button>
  <button class="secondary" onclick="goHome()">뒤로</button>
</section>

<section id="friendQuiz" class="card hidden">
  <div class="progress" id="friendProgress"></div>
  <div class="question" id="friendQuestion"></div>
  <div id="friendAnswers"></div>
  <button id="friendNext" onclick="friendNext()" disabled>다음 문제</button>
</section>

<section id="friendResult" class="card hidden">
  <h1>🎉 테스트 완료!</h1>
  <div class="score" id="friendScore"></div>
  <div class="result" id="friendMessage"></div>
  <p class="small" id="friendDetail"></p>
  <button onclick="copyLink()">🔗 테스트 링크 복사</button>
</section>

<section id="results" class="card hidden">
  <h1>📊 결과 모아보기</h1>
  <p class="sub" id="resultTitle"></p>
  <div id="resultList"></div>
  <button class="secondary" onclick="goHome()">처음으로</button>
</section>

</div>

["내가 가장 못할 것 같은 것은?",["요리","노래","춤","암기"],"friend"],
["내가 갑자기 유명해지면?",["즐긴다","조심한다","친구에게 자랑한다","평소처럼 산다"],"random"],
["내가 하루 동안 휴대폰을 못 쓴다면?",["괜찮다","심심하다","엄청 불편하다","미칠 것 같다"],"random"],
["내가 가장 좋아하는 사진은?",["친구 사진","풍경","셀카","웃긴 사진"],"friend"],
["내가 생각하는 친한 친구의 기준은?",["오래 알고 지냄","편하게 말함","서로 믿음","같이 많이 놈"],"friend"]
];

let creatorQuestions=[], creatorAnswers=[], cIndex=0;
let friendQuestions=[], friendAnswers=[], fIndex=0, currentTestId=null, currentTest=null, shareUrl=location.href.split("?")[0];

const $=id=>document.getElementById(id);
function hideAll(){["home","creator","creatorQuiz","share","join","friendQuiz","friendResult","results"].forEach(x=>$(x).classList.add("hidden"))}
window.goHome=()=>{hideAll();$("home").classList.remove("hidden")}
window.showCreator=()=>{hideAll();$("creator").classList.remove("hidden")}
window.showJoin=()=>{hideAll(); const id=new URLSearchParams(location.search).get("test"); if(id){loadTest(id)}else{$("join").classList.remove("hidden");$("joinTitle").textContent="친구 테스트";$("joinDesc").textContent="테스트 링크의 ?test=코드를 통해 접속해주세요."}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function pickQuestions(cat){
  let pool=cat==="random"?questions:questions.filter(q=>q[2]===cat||q[2]==="random");
  return shuffle(pool).slice(0,30);
}
window.beginCreator=()=>{
  const name=$("creatorName").value.trim();
  if(!name){alert("이름을 입력해주세요!");return}
  creatorQuestions=pickQuestions($("category").value); creatorAnswers=[]; cIndex=0;
  hideAll();$("creatorQuiz").classList.remove("hidden");showCreatorQuestion();
}
function showCreatorQuestion(){
  const q=creatorQuestions[cIndex];$("creatorProgress").textContent=`정답 설정 ${cIndex+1} / ${creatorQuestions.length}`;
  $("creatorQuestion").textContent=q[0]; const box=$("creatorAnswers");box.innerHTML="";
  q[1].forEach((a,i)=>{const b=document.createElement("button");b.textContent=a;b.className="answer";b.onclick=()=>{document.querySelectorAll("#creatorAnswers .answer").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");creatorAnswers[cIndex]=i;$("creatorNext").disabled=false};box.appendChild(b)});
  $("creatorNext").disabled=creatorAnswers[cIndex]===undefined;
}
window.creatorNext=async()=>{
  if(creatorAnswers[cIndex]===undefined)return;cIndex++;
  if(cIndex<creatorQuestions.length){showCreatorQuestion();return}
  const id=makeId();currentTestId=id;
  const data={name:$("creatorName").value.trim(),category:$("category").value,questions:creatorQuestions.map((q,i)=>({q:q[0],a:q[1],correct:creatorAnswers[i]})),createdAt:Date.now()};
  try{await set(ref(db,"tests/"+id),data);showShare(id)}catch(e){alert("저장에 실패했어요. Firebase Database 규칙을 확인해주세요.\n"+e.message)}
}
function makeId(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function showShare(id){hideAll();$("share").classList.remove("hidden");const url=location.href.split("?")[0]+"?test="+id;$("shareLink").textContent=url;shareUrl=url}
window.copyLink=async()=>{try{await navigator.clipboard.writeText(shareUrl);alert("링크를 복사했어요!")}catch{prompt("아래 링크를 복사하세요.",shareUrl)}}
async function loadTest(id){
  try{const snap=await get(ref(db,"tests/"+id));if(!snap.exists()){alert("존재하지 않는 테스트 링크예요.");goHome();return}
    currentTestId=id;currentTest=snap.val();hideAll();$("join").classList.remove("hidden");$("joinTitle").textContent=`${currentTest.name}의 테스트 💙`;$("joinDesc").textContent="친구가 생각하는 답을 골라보세요!";shareUrl=location.href;
  }catch(e){alert("테스트를 불러오지 못했어요.\n"+e.message)}
}
window.beginFriend=()=>{const name=$("friendName").value.trim();if(!name){alert("이름을 입력해주세요!");return}friendQuestions=currentTest.questions;friendAnswers=[];fIndex=0;hideAll();$("friendQuiz").classList.remove("hidden");showFriendQuestion()}
function showFriendQuestion(){
  const q=friendQuestions[fIndex];$("friendProgress").textContent=`${fIndex+1} / ${friendQuestions.length}`;$("friendQuestion").textContent=q.q;const box=$("friendAnswers");box.innerHTML="";
  q.a.forEach((a,i)=>{const b=document.createElement("button");b.textContent=a;b.className="answer";b.onclick=()=>{document.querySelectorAll("#friendAnswers .answer").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");friendAnswers[fIndex]=i;$("friendNext").disabled=false};box.appendChild(b)});
  $("friendNext").disabled=friendAnswers[fIndex]===undefined;
}
window.friendNext=async()=>{
  if(friendAnswers[fIndex]===undefined)return;fIndex++;
  if(fIndex<friendQuestions.length){showFriendQuestion();return}
  let correct=0;friendQuestions.forEach((q,i)=>{if(friendAnswers[i]===q.correct)correct++});
  const percent=Math.round(correct/friendQuestions.length*100);
  const resultRef=push(ref(db,"tests/"+currentTestId+"/results"));
  try{await set(resultRef,{name:$("friendName").value.trim(),score:percent,correct,total:friendQuestions.length,createdAt:Date.now()});showFriendResult(percent,correct)}
  catch(e){alert("결과 저장에 실패했어요.\n"+e.message);showFriendResult(percent,correct)}
}
function showFriendResult(p,c){hideAll();$("friendResult").classList.remove("hidden");$("friendScore").textContent=p+"%";$("friendDetail").textContent=`30문제 중 ${c}문제를 맞혔어요.`;let m=p===100?"👑 혹시 내 머릿속에 들어갔다 왔어?":p>=90?"💎 거의 영혼의 단짝!":p>=76?"🔥 찐친 인정!":p>=61?"😎 제법 친한 사이!":p>=41?"🙂 꽤 알고 있네?":p>=21?"🌱 아직 알아가는 중!":"🥚 우리... 이제 친해져보자!";$("friendMessage").textContent=m}
window.showResults=async()=>{
  if(!currentTestId)return;hideAll();$("results").classList.remove("hidden");$("resultTitle").textContent=`${currentTest?.name||"내"}의 테스트 결과`;
  const snap=await get(ref(db,"tests/"+currentTestId+"/results"));const box=$("resultList");box.innerHTML="";
  if(!snap.exists()){box.innerHTML='<p class="small">아직 참여한 친구가 없어요.</p>';return}
  const arr=Object.values(snap.val()).sort((a,b)=>b.score-a.score);
  arr.forEach((r,i)=>{const d=document.createElement("div");d.className="result-row";d.innerHTML=`<span>${i+1}. ${escapeHtml(r.name)}</span><b>${r.score}%</b>`;box.appendChild(d)})
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

const initialId=new URLSearchParams(location.search).get("test");
if(initialId)loadTest(initialId);
else goHome();
</script>
</body>
</html>
